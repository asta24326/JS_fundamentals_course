			// .filter
			// sa basically filter goes through an
			// array and for each checks conditions
			// and return true or false
			console.log([1, -3, 5].filter((value, index) => {
				// if (value >= 0) {
				// 	return true;
				// } else {
				// 	return false;
				// }
				// or shorter version
				return value >= 0;
			}));


			// .map
			// map will save the first "value" of the array
			// and will pass it to function's value
			console.log([1, 1, 3].map((value, index) => {
				return 10; // it will create an array with 10's

				return value + 10;
			}));
			// so the goal of map function is to transform and
			// create a new array, based on passed array

			// short version will be
			console.log([1, 1, 3].map(value => value + 10));


			function createCounter() {
				let count = 0; // Внешняя переменная

				return function() { // Внутренняя функция (замыкание)
					count++;
					return count;
				};
			}

			const counter1 = createCounter(); // createCounter() выполнилась и завершилась!

			console.log(counter1()); // 1
			console.log(counter1()); // 2
			console.log(counter1()); // 3
